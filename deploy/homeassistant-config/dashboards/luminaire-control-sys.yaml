title: Luminaire Control System
views:
  - title: Luminaire Control System
    path: overview
    icon: mdi:view-dashboard
    type: sections
    max_columns: 2
    
    # --- TOP LEVEL BADGES ---
    badges:
      - entity: binary_sensor.luminaire_system_power
        name: Power
      - entity: sensor.luminaire_mode
        name: Mode
      - entity: sensor.luminaire_running_scene
        name: Scene
        
    sections:
      # ==========================================
      # COLUMN 1: TELEMETRY & STATUS
      # ==========================================
      - type: grid
        cards:
          # --- CARD 1: SYSTEM OVERVIEW ---
          - type: entities
            title: System Overview
            state_color: true
            show_header_toggle: false
            entities:
              # Only keep timestamp on the Master Power state
              - entity: binary_sensor.luminaire_system_power
                name: System Power
                icon: mdi:power-standby
                secondary_info: last-changed
              - type: divider
              - entity: sensor.luminaire_mode
                name: Operating Mode
                icon: mdi:tune-variant
              - entity: sensor.luminaire_active_cct
                name: Color Temp
                icon: mdi:thermometer-lines
              - entity: sensor.luminaire_active_lux
                name: Intensity
                icon: mdi:brightness-percent
              - entity: sensor.luminaire_running_scene
                name: Current Scene

          # --- CARD 2: TIMER STATUS ---
          - type: entities
            title: Timer Configuration
            state_color: true
            entities:
              # Only keep timestamp on the Schedule Status
              - entity: binary_sensor.luminaire_timer_active
                name: Schedule Status
                icon: mdi:calendar-clock
                secondary_info: last-changed
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.luminaire_timer_active
                    state: "on"
                row:
                  entity: sensor.luminaire_timer_start
                  name: Starts At
                  icon: mdi:clock-start
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.luminaire_timer_active
                    state: "on"
                row:
                  entity: sensor.luminaire_timer_end
                  name: Ends At
                  icon: mdi:clock-end

      # ==========================================
      # COLUMN 2: HARDWARE & NETWORK
      # ==========================================
      - type: grid
        cards:
          # --- CARD 3: HARDWARE GAUGES ---
          - type: grid
            columns: 3
            square: true
            title: Hardware Health
            cards:
              - type: gauge
                entity: sensor.pi_cpu_usage
                name: CPU
                needle: true
                severity:
                  green: 0
                  yellow: 60
                  red: 85
              - type: gauge
                entity: sensor.pi_memory_usage
                name: RAM
                needle: true
                severity:
                  green: 0
                  yellow: 70
                  red: 90
              - type: gauge
                entity: sensor.pi_temperature
                name: Temp
                needle: true
                severity:
                  green: 0
                  yellow: 60
                  red: 75

          # --- CARD 4: MONOSPACE TERMINAL (UNIFORM FONT) ---
          - type: markdown
            title: Connected Luminaires
            content: >
              <pre style="background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.6; margin: 0; box-shadow: inset 0px 2px 4px rgba(0,0,0,0.3);">
              {%- set active_nodes = states.sensor | selectattr('entity_id', 'search', 'luminaire_node_') | selectattr('state', 'eq', 'Connected') | list -%}
              {%- if active_nodes | length > 0 -%}
                {%- for state in active_nodes %}
              <span style="color: #4ec9b0;">{{ state.attributes.get('ip_address', 'Unknown') }}</span> |
              cw: <span style="color: #569cd6;">{{ state.attributes.get('cw', 0) }}</span> | ww: <span style="color: #ce9178;">{{ state.attributes.get('ww', 0) }}</span>
              {% if not loop.last %}<span style="color: #404040;">-----------------------------------</span>{% endif %}
                {%- endfor %}
              {%- else %}
              <span style="color: #d16969;">[!] No luminaires connected.</span>
              {%- endif -%}
              </pre>